[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-set-planner"
version = "0.1.0"
description = "Set timing from cue A/B segments and explainable next-track recommendations"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
shadow-set-planner = "shadow_set_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
